name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade buildozer cython==0.29.33

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Poisson Analiz/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = poissonapp/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0/' buildozer.spec
        sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: poisson-analiz-apk
        path: bin/*.apk
