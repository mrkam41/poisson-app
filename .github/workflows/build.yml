name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk zip unzip autoconf libtool pkg-config libssl-dev lld
        pip install --upgrade "pip<24.1" buildozer "cython<3.0.0"

    - name: Create buildozer.spec and Build APK
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Poisson Analiz Motoru
        package.name = poissonapp
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy==2.3.0
        orientation = portrait
        osx.python_version = 3
        osx.kivy_version = 1.9.1
        fullscreen = 0
        android.presplash_color = #1a1a1f
        android.api = 33
        android.minapi = 24
        android.sdk = 33
        android.ndk = 25b
        android.private_storage = True
        android.accept_sdk_license = True
        android.archs = arm64-v8a
        p4a.branch = master
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: poisson-analiz-apk
        path: bin/*.apk
